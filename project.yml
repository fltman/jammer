name: Jammer
options:
  bundleIdPrefix: com.brattoo
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    ARCHS: arm64
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "2"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

packages:
  JammerKit:
    path: Packages/JammerKit

targets:
  Jammer:
    type: application
    platform: macOS
    sources:
      - App
      - path: Packages/JammerKit/Vendor/DeepFilterNet3_onnx.tar.gz
        buildPhase: resources
    dependencies:
      - package: JammerKit
        product: JammerEngine
      - package: JammerKit
        product: JammerCore
      - package: JammerKit
        product: JammerAudio
      - package: JammerKit
        product: JammerAgent
      - package: JammerKit
        product: JammerSpeech
      - package: JammerKit
        product: JammerAssistant
      - package: JammerKit
        product: JammerControls
      - package: JammerKit
        product: JammerWhisper
      - package: JammerKit
        product: JammerDenoise
      - package: JammerKit
        product: JammerMP3
      - package: JammerKit
        product: JammerResample
      - package: JammerKit
        product: JammerDiarize
      - package: JammerKit
        product: JammerParakeet
      - package: JammerKit
        product: JammerStems
      - package: JammerKit
        product: JammerDereverb
      - package: JammerKit
        product: JammerPlugins
      # Sparkle (updates), from scripts/fetch-sparkle.sh; embedded and signed with the app.
      - framework: Packages/JammerKit/Vendor/Sparkle/Sparkle.framework
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brattoo.jammer
        # The Rust static library (libDF) can't be loaded whole, which the debug dylib does.
        ENABLE_DEBUG_DYLIB: NO
        PRODUCT_NAME: Jammer
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The helper script runs swift build in the package, outside the script sandbox.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Features that a build can leave out (Config/Features.xcconfig).
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) $(JAMMER_FEATURE_CONDITIONS)
      configs:
        # Debug builds are a separate app (SIBLINGS.md §1): own defaults, saved state,
        # autosave and Keychain service, so test copies never touch the user's real Jämmer.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.brattoo.jammer.debug
    postBuildScripts:
      # Sparkle's licence (MIT, with bsdiff's and SUSignatureVerifier's BSD-2 notices, which ask to be
      # reproduced with the binary) goes in the app beside the framework; App/Credits.html points to it.
      - name: Sparkle licence
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          cp "$SRCROOT/Packages/JammerKit/Vendor/Sparkle/LICENSE" "$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Sparkle-LICENSE.txt"
      # The two helper programs that load VST 3 and CLAP plugins (so Jämmer never does) are
      # built from the package and put beside the app's own executable, each with a signature
      # of its own. They get no entitlements here: what a release needs is in docs/RELEASING.md.
      - name: Plugin helpers
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          cfg=debug; [ "$CONFIGURATION" = "Release" ] && cfg=release
          cd "$SRCROOT/Packages/JammerKit"
          [ "${JAMMER_CLAP:-NO}" = "YES" ] || { echo "note: JAMMER_CLAP is off (Config/Features.xcconfig); the plugin helpers are left out of this build"; rm -f "$BUILT_PRODUCTS_DIR/$EXECUTABLE_FOLDER_PATH"/jammer-plugin-*; exit 0; }
          [ -f Vendor/clap/include/clap/clap.h ] || { echo "warning: plugin SDKs not fetched (scripts/fetch-plugin-sdks.sh); VST 3 and CLAP are left out of this build"; exit 0; }
          for product in jammer-plugin-probe jammer-plugin-host; do
            env -i PATH="/usr/bin:/bin:/usr/sbin:/sbin" HOME="$HOME" DEVELOPER_DIR="$DEVELOPER_DIR" xcrun swift build -c "$cfg" --product "$product" --scratch-path "$SRCROOT/build/helpers"
            cp "$SRCROOT/build/helpers/$cfg/$product" "$BUILT_PRODUCTS_DIR/$EXECUTABLE_FOLDER_PATH/$product"
            codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" "$BUILT_PRODUCTS_DIR/$EXECUTABLE_FOLDER_PATH/$product"
          done
    entitlements:
      path: App/Jammer.entitlements
      properties:
        # Developer ID first; the sandbox is decided after the plugin-hosting prototype.
        com.apple.security.app-sandbox: false
        # Recording: the input device, after macOS's microphone question; started only in the window (2026-11-25).
        com.apple.security.device.audio-input: true
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Jämmer
        CFBundleDisplayName: Jämmer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        LSApplicationCategoryType: public.app-category.music
        NSHumanReadableCopyright: "© 2026 Anders Bjarby. MIT licence."
        NSPrincipalClass: NSApplication
        JammerHomepage: https://jammer.brattoo.com
        # Sparkle: the appcast (the one server of ours, PROVIDERS.md) and the public half of the update key.
        SUFeedURL: https://jammer.brattoo.com/appcast.xml
        # The public half of the EdDSA key (made 2026-11-17 in Anders's Keychain, account "jammer"; the private half never leaves it).
        SUPublicEDKey: hrZ3zKoaguRUnHgwwWFmKhpr7UUKP5la6bEeO+QNIo4=
        NSSpeechRecognitionUsageDescription: Jämmer transcribes your recordings on this Mac so you can edit them as text. The audio never leaves the Mac.
        NSMicrophoneUsageDescription: Jämmer records the tracks you arm, from the input you choose, only while you record in the window. Nothing it records leaves the Mac.
        NSMotionUsageDescription: When you choose Follow Head Movements, Jämmer turns what you hear on headphones as your head turns. It reads only your headphones' motion, only while you listen, and keeps nothing.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Jammer Project
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSTypeIsPackage: true
            NSDocumentClass: $(PRODUCT_MODULE_NAME).JammerDocument
            LSItemContentTypes:
              - com.brattoo.jammer.project
          - CFBundleTypeName: Audio
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            NSDocumentClass: $(PRODUCT_MODULE_NAME).JammerDocument
            LSItemContentTypes:
              - public.audio
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.brattoo.jammer.project
            UTTypeDescription: Jammer Project
            UTTypeConformsTo:
              - com.apple.package
              - public.composite-content
            UTTypeTagSpecification:
              public.filename-extension:
                - jammer
